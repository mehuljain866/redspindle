name: Build & Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: RedSpindle-Windows.exe
            build_cmd: |
              pyinstaller --onefile --windowed --name "RedSpindle-Windows" --icon "icon.ico" --collect-all customtkinter --collect-all spotapi --collect-all pygame --collect-all cv2 --hidden-import cd_prep --hidden-import cd_art --hidden-import track_matching --hidden-import ffmpeg_support --add-data "icon.ico;." gui.py
              copy dist\RedSpindle-Windows.exe dist\Spotify-Downloader-Windows.exe
            output_path: dist/*Windows.exe

          - os: ubuntu-latest
            artifact_name: RedSpindle-Linux
            build_cmd: |
              pyinstaller --onefile --name "RedSpindle-Linux" --collect-all customtkinter --collect-all spotapi --collect-all pygame --collect-all cv2 --hidden-import cd_prep --hidden-import cd_art --hidden-import track_matching --hidden-import ffmpeg_support --add-data "icon.ico:." gui.py
              cp dist/RedSpindle-Linux dist/Spotify-Downloader-Linux
            output_path: dist/*Linux*

          - os: macos-latest
            artifact_name: RedSpindle-macOS.zip
            build_cmd: |
              pyinstaller --onefile --windowed --name "RedSpindle-macOS" --icon "icon.ico" --collect-all customtkinter --collect-all spotapi --collect-all pygame --collect-all cv2 --hidden-import cd_prep --hidden-import cd_art --hidden-import track_matching --hidden-import ffmpeg_support --add-data "icon.ico:." gui.py
              cd dist && zip -r RedSpindle-macOS.zip RedSpindle-macOS.app RedSpindle-macOS 2>/dev/null || zip -r RedSpindle-macOS.zip *
              cp RedSpindle-macOS.zip Spotify-Downloader-macOS.zip
            output_path: dist/*macOS.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-tk libgl1 libglib2.0-0 xvfb

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg python-tk@3.12 || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit and functional regression test suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Run unit and functional regression test suite (Non-Linux)
        if: runner.os != 'Linux'
        run: python -m unittest discover -s tests -v

      - name: Build Standalone Executable
        run: ${{ matrix.build_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_path }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Flatten release assets
        run: |
          mkdir -p final_assets
          find release_assets -type f -exec cp {} final_assets/ \;
          ls -la final_assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v2.2.2' }}
          name: Red Spindle ${{ github.ref_name || 'v2.2.2' }}
          draft: false
          prerelease: false
          files: final_assets/*
          body: |
            ### Red Spindle Standalone Releases

            Download the single-file executable for your platform:
            - **Windows**: `RedSpindle-Windows.exe` (Run directly, no Python required)
            - **Linux**: `RedSpindle-Linux` (`chmod +x RedSpindle-Linux && ./RedSpindle-Linux`)
            - **macOS**: `RedSpindle-macOS.zip` (Extract and launch)
